[project]
name = "talon-rl"
version = "0.0.1"
description = "Training code for TALON (Terrain-Adaptive Locomotion via Objective Negotiation) — prelim scope only."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "gymnasium>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["talon_rl*"]

[tool.pytest.ini_options]
# scripts/moppo/ isn't part of the installed talon_rl package (matches
# jaykorea/Isaac-RL-Two-wheel-Legged-Bot's own scripts/co_rl/ convention —
# the RL algorithm is driver code, not part of the portable task package)
# — this lets tests/ import it the same way scripts/train_prelim.py does.
pythonpath = ["scripts"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
